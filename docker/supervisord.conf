[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
logfile_backups=0
pidfile=/run/supervisord.pid

[program:backend]
command=/app/server
directory=/app
user=app
stopsignal=TERM
stopwaitsecs=50
priority=10
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stderr_logfile_backups=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
environment=HOME=/app

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
stopsignal=QUIT
stopwaitsecs=45
priority=20
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stderr_logfile_backups=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
