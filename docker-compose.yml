services:
  one-mail:
    image: ghcr.io/zuoban/one-mail:latest
    container_name: one-mail
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - one-mail-data:/app/data
    environment:
      TZ: Asia/Shanghai
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}

volumes:
  one-mail-data:
    driver: local
