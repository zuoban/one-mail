services:
  one-mail:
    image: ghcr.io/zuoban/one-mail:latest
    container_name: one-mail
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - one-mail-data:/app/data
    environment:
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random secret of at least 32 bytes}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}

volumes:
  one-mail-data:
    driver: local
